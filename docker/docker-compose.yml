services:
  db:
    container_name: aligulac-db
    image: postgres:18.0
    ports:
      - '${ALIGULAC_EXPOSE_DB_PORT:-}:5432'
    environment:
      POSTGRES_USER: aligulac
      POSTGRES_PASSWORD: aligulac
      POSTGRES_DB: aligulac
    volumes:
      - ./data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d aligulac -U aligulac"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
      start_interval: 0.5s

  legacy:
    container_name: aligulac-legacy
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${ALIGULAC_EXPOSE_LEGACY_PORT:-}:8000'
    build:
      context: ../
      dockerfile: docker/Dockerfile.legacy

  proxy:
    container_name: aligulac-proxy
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${ALIGULAC_EXPOSE_PROXY_PORT:-}:80'
    build:
      context: .
      dockerfile: Dockerfile.frontend
